name: image

# Building PX4 and Gazebo takes a while, so the container is built weekly and on demand.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # Repository variables set from the LostInPlaceSim outputs, so the account ID stays out of git.
      PUSH_ROLE: ${{ vars.AWS_IMAGE_PUSH_ROLE }}
      REPOSITORY: ${{ vars.ECR_IMAGE_REPOSITORY }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: lost-in-place:ci
          load: true
          build-args: GIT_SHA=${{ github.sha }}
      - run: docker run --rm lost-in-place:ci doctor
      - name: Episode output directory is writable
        run: docker run --rm --entrypoint test lost-in-place:ci -w runs
      - if: github.ref == 'refs/heads/main' && env.PUSH_ROLE != '' && env.REPOSITORY != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.PUSH_ROLE }}
          aws-region: us-east-1
      - if: github.ref == 'refs/heads/main' && env.PUSH_ROLE != '' && env.REPOSITORY != ''
        uses: aws-actions/amazon-ecr-login@v2
      - if: github.ref == 'refs/heads/main' && env.PUSH_ROLE != '' && env.REPOSITORY != ''
        run: |
          for tag in latest "${GITHUB_SHA::12}"; do
            docker tag lost-in-place:ci "$REPOSITORY:$tag"
            docker push "$REPOSITORY:$tag"
          done
