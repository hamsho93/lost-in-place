[project]
name = "lost-in-place-infra"
version = "0.0.1"
description = "AWS CDK app for running Lost in Place episodes on spot AWS Batch"
requires-python = ">=3.11"
dependencies = [
    "aws-cdk-lib>=2.170,<3",
    "constructs>=10.3,<11",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
