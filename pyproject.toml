[project]
name = "lost-in-place"
version = "0.0.1"
description = "Does an LLM drone planner notice when its autopilot is lost? A PX4 + Gazebo benchmark for estimator-degraded safety."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mahmoud Hamsho" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mavsdk-grpc>=3.17.4,<4",
    "numpy>=1.26",
    "pillow>=10",
    "pydantic>=2.6",
    "pyulog>=1.1",
    "pyyaml>=6",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
plot = ["matplotlib>=3.8"]

[project.scripts]
lip = "lost_in_place.cli:main"

[project.urls]
Repository = "https://github.com/hamsho93/lost-in-place"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "ruff>=0.5",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lost_in_place"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["infra/cdk.out"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["mavsdk_grpc.*", "pyulog.*", "PIL.*", "boto3.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
