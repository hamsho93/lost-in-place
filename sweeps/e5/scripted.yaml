# E5 wave (freeze-v3): the scripted DEXI-cadence control (design section 6), both cadences.
# Template t1, N = 120: 1440 episodes. Written by scripts/e5_sweeps.py.
name: e5-scripted
reps: 1
validators: [none]
latency_s: 2.0
shuffle_seed: 0
cells:
- scenarios: ['scenarios/e5/t1/families/c0??_loud.yaml', 'scenarios/e5/t1/families/c1[0-1]?_loud.yaml']
  planners:
  - arm: dexi/rule-2m
    options: {driver: dexi, prompt: dexi-v2}
  - arm: dexi/rule-leg
    options: {driver: dexi, prompt: dexi-v2}
  observations: [O1]
