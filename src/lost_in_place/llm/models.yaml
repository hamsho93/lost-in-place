# Models available as planner arms. The key is the arm's name in results and on the command line.
#
# provider   which client calls it (see lost_in_place/llm/clients.py: CLIENTS)
# model_id   the provider's identifier; for Bedrock, a system inference profile such as us.anthropic.*
# Optional:  region, max_tokens, temperature (omit to use the provider default), tool_choice (any|auto)
# bedrock only: additional_request_fields, sent as Converse's additionalModelRequestFields
# openai_compatible only: base_url, api_key_env, extra_body (see docs/planners.md)
# bedrock_imported only: chat_template; model_id is the imported model's name (see docs/planners.md)
#
# Pin exact model identifiers: results are only comparable for the same model version.

claude-sonnet-4-6:
  provider: bedrock
  model_id: us.anthropic.claude-sonnet-4-6
  temperature: 0
  notes: >-
    Frontier arm, added 2026-10-12. The newest Claude model this account can use on Bedrock;
    the 5.x models need an agreement through AWS Sales.

rule-2m:
  provider: scripted
  model_id: scripted-rule-dexi-2m
  notes: >-
    Not a model: freeze-v3's scripted DEXI-cadence control (design 6), added 2026-10-16. Run as
    dexi/rule-2m. It reads the rendered prompt, flies each leg in 2.0 m moves, holds 2 s on bad
    health and lands if it is still bad (lost_in_place/llm/scripted_dexi.py). No model call.

rule-leg:
  provider: scripted
  model_id: scripted-rule-dexi-leg
  notes: >-
    As rule-2m, at whole-leg cadence: one move per leg, as DEXI's student flies them.

qwen3-4b-zero-shot:
  provider: bedrock_imported
  model_id: lip-qwen3-4b-thinking-2507-768f209
  chat_template: qwen3-thinking-2507
  max_tokens: 8192
  temperature: 0
  notes: >-
    Zero-shot arm of E2, added 2026-10-13: Qwen/Qwen3-4B-Thinking-2507 at Hugging Face revision
    768f209d9ea81521153ed38c47d515654e938aea, bf16, imported with Bedrock Custom Model Import
    (infra/README.md). The same build as DEXI's C0 arm 2 (Ollama qwen3:4b), whose reasoning can't be
    turned off; the 8192-token cap and temperature 0 match C0.

qwen3-4b-student:
  provider: bedrock_imported
  model_id: lip-qwen3-4b-c1-c6bc0a6
  chat_template: qwen3-instruct-2507
  max_tokens: 8192
  temperature: 0
  notes: >-
    Student arm of E2, added 2026-10-13: DEXI's C1 student (Qwen3-4B-Instruct-2507 with LoRA SFT v1,
    fused, bf16), the model of DEXI's arm 3. Weights are private. The import uses the student's
    weights and config with the tokenizer files of Qwen/Qwen3-4B-Instruct-2507 at revision
    cdbee75f17c01a7cc42f958dc650907174af0554: they encode identically, but the student's own
    tokenizer.json marks <tool_call> as a special token, which a server may strip from replies.
    c6bc0a6 is the start of the first weight shard's CRC64NVME checksum in S3.

gpt-5.6-sol:
  provider: bedrock
  model_id: us.openai.gpt-5.6-sol
  region: us-east-2
  max_tokens: 4096
  tool_choice: any
  notes: >-
    E5 frontier arm, added 2026-10-16 in place of GPT-6.1 Sol, which the account can't use yet, with
    the settings freeze-v3 states before its first call (design 9.2). Served from us-east-2, the only
    region with GPT-5.6 Sol quota. Provider-default effort (medium): no effort field, decided
    2026-10-17 from the frontier smoke, where default effort cost about the same per episode as low.
    No temperature, which GPT-5.6 Sol rejects, so the arm is stochastic and its test-retest is
    checked (design 9.3, check 5). The 4096-token cap leaves room for reasoning. If the smoke call's
    request is rejected, fallback 1 below is tried and the arm flies the first entry accepted.

gpt-5.6-sol-fb1:
  provider: bedrock
  model_id: us.openai.gpt-5.6-sol
  region: us-east-2
  max_tokens: 4096
  tool_choice: auto
  notes: >-
    Fallback 1 of gpt-5.6-sol (design 9.2): tool_choice auto, the shape the frontier smoke flew. A
    reply without a tool call is invalid, as under any.

claude-sonnet-5-5:
  provider: bedrock
  model_id: us.anthropic.claude-sonnet-5-5
  region: us-east-2
  max_tokens: 4096
  tool_choice: auto
  notes: >-
    E5 fifth arm, approved 2026-10-16 (fifth-arm spec), served from us-east-2. tool_choice auto
    because Sonnet 5.5 rejects forced tool use; a reply without a tool call is invalid. No
    temperature, which Sonnet 5.5 rejects at any non-default value, so the arm is stochastic and its
    test-retest is checked. Provider-default effort (high): no effort field, decided 2026-10-17 from
    the frontier smoke, which flew these exact settings.

# Smoke-only: checks the us-east-2 request shape cheaply. Not an E5 arm; no freeze-v3 sweep uses it.
claude-haiku-5-5:
  provider: bedrock
  model_id: us.anthropic.claude-haiku-5-5
  region: us-east-2
  max_tokens: 4096
  tool_choice: auto
  additional_request_fields: {output_config: {effort: low}}
  notes: >-
    Smoke-only, never in a freeze-v3 sweep, and flown before the 2026-10-17 switch to default
    effort, so it keeps effort low. No temperature: Anthropic's docs say Haiku 5.5 rejects any
    non-default temperature, and the smoke flies the configuration expected to work.
