# The E5 wave (freeze-v3 plan sections 10 and 12, step 5), as `scripts/e5_submit.py` runs it.
#
# Arms run in the listed order, each once its `start_after` conditions hold. The sweep files are
# written by `scripts/e5_sweeps.py` (WP15) for the template, N and arm set fixed at the freeze-v3
# tag; the adaptation PR (WP18) updates `n_families`, the sweep paths, the canary costs and pinned
# smoke configs of GPT-5.6 Sol and Claude Sonnet 5.5 here (A-7). Dollar figures are the plan's medians and P90s at N = 120
# (section 10.2) and S-7's caps; caps scale by `cap_factor_above_base` at N = 160.
name: e5
n_families: 120
ledger_prefix: manifests/e5/ledger
queries_log: manifests/e5/queries.log
poll_s: 60
topup_min: 5
array_max: 10
max_in_flight: 64
fixed_remaining_usd: 10.0  # retries and other tagged AWS spend (section 10.2)

months:
  "2026-10": {stop_usd: 420, budget_actual: true, job_p90_check: true}
  "2026-11": {stop_usd: 400}
  # Section 10.4: a month-fit arm that doesn't fit November moves here. Mahmood sets stop_usd (up to
  # about $390: GPT-5.6 Sol at most about $205 with the second labeller, Claude Sonnet 5.5 about
  # $185); until then nothing is submitted in December, and with none set by the deadline the
  # deferred arms are dropped.
  "2026-12": {arms: [gpt-5.6-sol, probe-gpt, labeller-2, claude-sonnet-5-5, probe-sonnet-5-5]}
deferral_deadline: "2026-11-20"

preflight_commands:
  - [uv, run, lip, freeze-record, --freeze, v3, --check]
# S-1: must exit 0 only when every scripted gate of section 6 passes on the gate cells; its output is
# kept in the ledger. {bucket} and {manifest:<arm>} are filled in at run time. The flags are the
# interface expected from `lip stats --design v3` (WP9).
gate_command: [uv, run, lip, stats, --design, v3, --gates, "s3://{bucket}/runs", --manifest, "{manifest:scripted-gate}"]

arms:
  # Section 6's gated cells (loud O1 and O0, brief, healthy; both cadences) run first, on all N
  # families, before any LLM episode. The timed-loud and flowscale cells are the scripted remainder.
  - name: scripted-gate
    sweep: sweeps/e5/scripted.yaml
    select: {scenario_regex: '_(loud|brief|healthy)$'}
    cap: 64
    ramp_step: 10
    cap_usd: 10
    estimate_usd: 4.7
    p90_usd: 5.4

  - name: claude
    sweep: sweeps/e5/claude-sonnet-4-6.yaml
    cap: 25
    needs_gate: true
    start_after: [{arm: scripted-gate}]
    bedrock_model: us.anthropic.claude-sonnet-4-6
    price: {input_per_mtok: 3.30, output_per_mtok: 16.50}
    model: claude-sonnet-4-6
    cap_usd: 95
    estimate_usd: 79
    p90_usd: 90

  - name: student
    sweep: sweeps/e5/qwen3-4b-student.yaml
    cap: 39
    needs_gate: true
    start_after: [{arm: scripted-gate}]
    import_name: lip-qwen3-4b-c1-c6bc0a6
    cap_usd: 50
    estimate_usd: 38
    p90_usd: 45

  - name: probe-student
    kind: external
    import_name: lip-qwen3-4b-c1-c6bc0a6
    cap_usd: 5
    estimate_usd: 2.5
    p90_usd: 3

  - name: zero-shot
    sweep: sweeps/e5/qwen3-4b-zero-shot.yaml
    cap: 39
    cap_rules: [{after: {arm: claude}, cap: 64}]
    needs_gate: true
    start_after: [{arm: student, fraction: 0.9}]
    import_name: lip-qwen3-4b-thinking-2507-768f209
    cap_usd: 105
    estimate_usd: 77
    p90_usd: 92

  - name: probe-zero-shot
    kind: external
    import_name: lip-qwen3-4b-thinking-2507-768f209
    cap_usd: 6
    estimate_usd: 4.5
    p90_usd: 5.5

  - name: probe-claude
    kind: external
    bedrock_model: us.anthropic.claude-sonnet-4-6
    price: {input_per_mtok: 3.30, output_per_mtok: 16.50}
    cap_usd: 5
    estimate_usd: 4.9
    p90_usd: 5.5

  - name: scripted-rest
    sweep: sweeps/e5/scripted.yaml
    select: {scenario_regex: '_(loud|brief|healthy)$', invert: true}
    cap: 64
    start_after: [{arm: claude, fraction: 0.9}, {arm: student}]
    cap_usd: 10
    estimate_usd: 2.3
    p90_usd: 2.6

  # Called through its tagged profile in us-east-2, the only region with GPT-5.6 Sol quota, so its
  # tokens are metered there (the region comes from its models.yaml entry). us-east-2 lists 10M TPM
  # for the us. profile, with output tokens burning it 10x; 40 slots at about one call a minute each
  # use well under 1M TPM.
  - name: gpt-5.6-sol
    sweep: sweeps/e5/gpt-5.6-sol.yaml
    cap: 40
    needs_gate: true
    month_fit: true
    start_after: [{arm: claude}, {arm: student}, {arm: zero-shot}, {arm: scripted-rest}]
    bedrock_model: us.openai.gpt-5.6-sol
    # Regional (us.) list price, billed through AWS Marketplace.
    price: {input_per_mtok: 4.40, output_per_mtok: 22.00}
    # From the frontier smoke's default-effort tokens (design section 10.1), as in freeze_v3_cost.py.
    estimate_usd: 73
    p90_usd: 104
    # Its probe (7.7) and the second labeller (10.2), which are counted in its projection.
    probe_usd: 17.9
    # Measured by its canary (A-3) and filled in by the adaptation PR; GPT never starts without it.
    canary_usd_per_episode: null
    model: gpt-5.6-sol
    pinned_model:
      provider: bedrock
      model_id: us.openai.gpt-5.6-sol
      region: us-east-2
      max_tokens: 4096
      temperature: null
      tool_choice: any
      additional_request_fields: null

  - name: probe-gpt
    kind: external
    counted_in: gpt-5.6-sol
    bedrock_model: us.openai.gpt-5.6-sol
    price: {input_per_mtok: 4.40, output_per_mtok: 22.00}
    model: gpt-5.6-sol
    estimate_usd: 7.7
    p90_usd: 10.4

  # The second labeller double-codes GPT-5.6 Sol's sampled packets plus a matched draw of other LLM
  # arms' (SPEC-v3 departure 15), outside AWS, in GPT's month; its spend is recorded when its window
  # closes. About 410 packets at $0.02-0.03 each, as in freeze_v3_cost.py.
  - name: labeller-2
    kind: external
    counted_in: gpt-5.6-sol
    cap_usd: 14
    estimate_usd: 10.2
    p90_usd: 11.8

  # Mirrors GPT-5.6 Sol (fifth-arm spec): admission A-3b with the same $0.060/episode canary limit,
  # summed after GPT in section 10.4. Called through the stack's tagged profile in us-east-2, so its
  # tokens are metered there (the region comes from its models.yaml entry). us-east-2 lists a 6M TPM
  # quota and no requests-per-minute quota; at about one call per slot a minute, each holding at most
  # ~2.5k input + 4,096 max_tokens at the start and settling at input + 10-15 x output, 40 slots use
  # under 0.3M TPM. 40 matches GPT; the ramp surfaces any unlisted limit and S-4 cuts the cap.
  - name: claude-sonnet-5-5
    sweep: sweeps/e5/claude-sonnet-5-5.yaml
    cap: 40
    ramp_step: 10
    needs_gate: true
    month_fit: true
    start_after:
      - {arm: claude}
      - {arm: student}
      - {arm: zero-shot}
      - {arm: scripted-rest}
      - {arm: gpt-5.6-sol}
    bedrock_model: us.anthropic.claude-sonnet-5-5
    # Regional (us.) list price, billed through AWS Marketplace. Its tokenizer's ~30% more tokens per
    # text are already in the counted tokens, so the price is not scaled.
    price: {input_per_mtok: 2.20, output_per_mtok: 11.00}
    # From the frontier smoke's default-effort tokens (design section 10.1), as in freeze_v3_cost.py.
    estimate_usd: 83
    p90_usd: 112
    probe_usd: 6.2
    canary_usd_per_episode: null
    model: claude-sonnet-5-5
    pinned_model:
      provider: bedrock
      model_id: us.anthropic.claude-sonnet-5-5
      region: us-east-2
      max_tokens: 4096
      temperature: null
      tool_choice: auto
      additional_request_fields: {thinking: {type: adaptive, display: summarized}}

  - name: probe-sonnet-5-5
    kind: external
    counted_in: claude-sonnet-5-5
    bedrock_model: us.anthropic.claude-sonnet-5-5
    price: {input_per_mtok: 2.20, output_per_mtok: 11.00}
    model: claude-sonnet-5-5
    estimate_usd: 6.2
    p90_usd: 7.5

  # The blind-labeller check runs outside AWS; its spend is recorded when its window closes.
  - name: labeller
    kind: external
    cap_usd: 32
    estimate_usd: 27
    p90_usd: 31
